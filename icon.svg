<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.04"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="100" height="100" rx="22"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Area fill under chart -->
  <polygon points="15,72 32,55 50,62 68,38 85,24 85,80 15,80"
    fill="url(#area)" clip-path="url(#clip)"/>
  <!-- Chart line -->
  <polyline points="15,72 32,55 50,62 68,38 85,24"
    fill="none" stroke="white" stroke-width="5.5"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <!-- Dots -->
  <circle cx="15" cy="72" r="3.5" fill="white" opacity="0.6"/>
  <circle cx="32" cy="55" r="3.5" fill="white" opacity="0.6"/>
  <circle cx="50" cy="62" r="3.5" fill="white" opacity="0.6"/>
  <circle cx="68" cy="38" r="3.5" fill="white" opacity="0.6"/>
  <!-- Highlight dot at peak -->
  <circle cx="85" cy="24" r="7" fill="white" opacity="0.2"/>
  <circle cx="85" cy="24" r="5" fill="white"/>
  <circle cx="85" cy="24" r="2.5" fill="#6366f1"/>
  <!-- Baseline -->
  <line x1="15" y1="80" x2="85" y2="80"
    stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>
</svg>
